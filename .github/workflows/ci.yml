# Checks every push and pull request. Deploys are done by Vercel (frontend) and Render
# (backend) from their GitHub integrations; Render waits for this workflow to pass first.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clim_backend
    env:
      CLIMAI_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: clim_backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest -v
      - name: Scorer self-check
        run: python crop_suitability.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clim_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: clim_frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clim_frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
